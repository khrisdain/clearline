apiVersion: v1
kind: Service
metadata:
  name: clearline-api
  namespace: clearline
spec:
  selector: { app: clearline-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clearline-api
  namespace: clearline
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: clearline-api }
