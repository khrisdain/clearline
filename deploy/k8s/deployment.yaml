apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearline-api
  namespace: clearline
  labels: { app: clearline-api }
spec:
  replicas: 2                     # stateless: documents, vectors and the audit log live in Postgres
  selector:
    matchLabels: { app: clearline-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: clearline-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: clearline-api }
      containers:
        - name: api
          image: ghcr.io/khrisdain/clearline:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: clearline }
            - secretRef: { name: clearline }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
